<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EISVO LLM OCR</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #fff; --text: #16181d; --muted: #667085;
    --border: #e4e7ec; --accent: #2454db; --accent-soft: #eaf0ff;
    --ok: #157f3d; --ok-bg: #eaf6ef; --ok-line: #abd8bc;
    --bad: #b42020; --bad-bg: #fdeeee; --bad-line: #f0b6b6;
    --warn: #92510e; --warn-bg: #fdf3e2; --warn-line: #ecc994;
    --na: #58606e; --na-bg: #eef0f3; --na-line: #d3d8df;
    --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1116; --card: #181c23; --text: #e8eaee; --muted: #98a1b0;
      --border: #272d38; --accent: #7fa3ff; --accent-soft: #1a2233;
      --ok: #7fd49a; --ok-bg: #12291a; --ok-line: #235c37;
      --bad: #f29a9a; --bad-bg: #331616; --bad-line: #6e2626;
      --warn: #ecc37f; --warn-bg: #33260f; --warn-line: #6e5320;
      --na: #aab3c0; --na-bg: #222833; --na-line: #3a4250;
      --shadow: none;
    }
  }
  :root[data-theme="light"] {
    --bg: #f4f5f7; --card: #fff; --text: #16181d; --muted: #667085;
    --border: #e4e7ec; --accent: #2454db; --accent-soft: #eaf0ff;
    --ok: #157f3d; --ok-bg: #eaf6ef; --ok-line: #abd8bc;
    --bad: #b42020; --bad-bg: #fdeeee; --bad-line: #f0b6b6;
    --warn: #92510e; --warn-bg: #fdf3e2; --warn-line: #ecc994;
    --na: #58606e; --na-bg: #eef0f3; --na-line: #d3d8df;
    --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.04);
  }
  :root[data-theme="dark"] {
    --bg: #0e1116; --card: #181c23; --text: #e8eaee; --muted: #98a1b0;
    --border: #272d38; --accent: #7fa3ff; --accent-soft: #1a2233;
    --ok: #7fd49a; --ok-bg: #12291a; --ok-line: #235c37;
    --bad: #f29a9a; --bad-bg: #331616; --bad-line: #6e2626;
    --warn: #ecc37f; --warn-bg: #33260f; --warn-line: #6e5320;
    --na: #aab3c0; --na-bg: #222833; --na-line: #3a4250;
    --shadow: none;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.55 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
         background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 1160px; margin: 0 auto; padding: 22px 16px 72px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: -.01em; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .logo { width: 30px; height: 30px; border-radius: 8px; background: var(--accent);
          display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 15px; }
  .sub { color: var(--muted); margin: 2px 0 18px; font-size: 13px; }
  .theme-btn { border: 1px solid var(--border); background: var(--card); color: var(--muted);
               border-radius: 8px; width: 34px; height: 34px; cursor: pointer; font-size: 15px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px;
          padding: 18px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .row { display: flex; gap: 14px; flex-wrap: wrap; align-items: end; }
  .field { flex: 1; min-width: 220px; }
  label { display: block; font-size: 12.5px; font-weight: 600; margin-bottom: 6px; color: var(--muted); }
  input[type=file] { width: 100%; padding: 9px; border: 1px dashed var(--border); border-radius: 9px;
                     background: var(--bg); font-size: 13px; color: var(--text); cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; border: 0; padding: 11px 26px; border-radius: 9px;
                   font-size: 15px; font-weight: 600; cursor: pointer; }
  button.primary:disabled { opacity: .5; cursor: default; }
  .health { font-size: 12px; color: var(--muted); margin-top: 12px; display: flex; gap: 18px; flex-wrap: wrap; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }
  .spinner { display: none; margin: 30px auto 8px; width: 34px; height: 34px; border: 3px solid var(--border);
             border-top-color: var(--accent); border-radius: 50%; animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #status-msg { text-align: center; color: var(--muted); font-size: 13px; }

  .verdict { border-radius: 14px; padding: 18px 22px; margin-bottom: 14px; border: 1px solid;
             display: flex; align-items: center; gap: 16px; }
  .verdict.v-bad { background: var(--bad-bg); border-color: var(--bad-line); }
  .verdict.v-ok  { background: var(--ok-bg);  border-color: var(--ok-line); }
  .verdict .icon { font-size: 26px; width: 46px; height: 46px; border-radius: 12px; display: grid;
                   place-items: center; flex: none; }
  .verdict.v-bad .icon { background: var(--bad); color: #fff; }
  .verdict.v-ok  .icon { background: var(--ok);  color: #fff; }
  .verdict .word { font-size: 24px; font-weight: 800; letter-spacing: .03em; line-height: 1.1; }
  .verdict.v-bad .word { color: var(--bad); }
  .verdict.v-ok  .word { color: var(--ok); }
  .verdict .expl { color: var(--text); font-size: 13.5px; margin-top: 1px; opacity: .9; }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-bottom: 14px; }
  .kpi { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px;
         box-shadow: var(--shadow); }
  .kpi b { display: block; font-size: 28px; font-weight: 800; line-height: 1.15; }
  .kpi span { font-size: 12px; color: var(--muted); font-weight: 600; }
  .kpi.k-ok b { color: var(--ok); } .kpi.k-bad b { color: var(--bad); } .kpi.k-na b { color: var(--na); }

  .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin: 2px 0 12px; }
  .tab { border: 1px solid var(--border); background: var(--card); color: var(--text); border-radius: 999px;
         padding: 7px 15px; font-size: 13px; font-weight: 600; cursor: pointer; display: inline-flex; gap: 7px; align-items: center; }
  .tab .cnt { background: var(--bg); border-radius: 999px; padding: 0 8px; font-size: 12px; color: var(--muted); }
  .tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .tab.active .cnt { background: rgba(255,255,255,.22); color: #fff; }

  .tbl-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; min-width: 640px; }
  th, td { text-align: left; padding: 11px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; position: sticky; top: 0; background: var(--card); }
  tbody tr:last-child td { border-bottom: 0; }
  td.val { word-break: break-word; max-width: 320px; }
  td.val.empty-val { color: var(--muted); font-style: italic; }
  .fname { font-weight: 650; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  .fdesc { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px;
           font-size: 11px; font-weight: 700; letter-spacing: .03em; border: 1px solid; white-space: nowrap; }
  .b-match    { color: var(--ok);   background: var(--ok-bg);   border-color: var(--ok-line); }
  .b-mismatch { color: var(--bad);  background: var(--bad-bg);  border-color: var(--bad-line); }
  .b-unknown  { color: var(--warn); background: var(--warn-bg); border-color: var(--warn-line); }
  .b-na       { color: var(--na);   background: var(--na-bg);   border-color: var(--na-line); }
  .b-low      { color: var(--warn); background: var(--warn-bg); border-color: var(--warn-line); }
  .b-failed   { color: var(--bad);  background: var(--bad-bg);  border-color: var(--bad-line); }
  .b-high     { color: var(--ok);   background: var(--ok-bg);   border-color: var(--ok-line); }
  details { margin-top: 10px; }
  summary { cursor: pointer; font-weight: 600; font-size: 13.5px; color: var(--muted); }
  pre { background: var(--bg); border: 1px solid var(--border); border-radius: 9px; padding: 12px;
        overflow-x: auto; font-size: 12px; line-height: 1.5; }
  .err { background: var(--bad-bg); color: var(--bad); border: 1px solid var(--bad-line); padding: 12px 16px;
         border-radius: 9px; display: none; margin-bottom: 14px; }
  h2 { font-size: 14px; margin: 0 0 4px; }
  .empty { color: var(--muted); text-align: center; padding: 26px; font-size: 13.5px; }
  .legend { font-size: 12px; color: var(--muted); margin: -4px 0 12px; display: flex; gap: 16px; flex-wrap: wrap; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo">E</div>
      <div>
        <h1>EISVO LLM OCR</h1>
      </div>
    </div>
    <button class="theme-btn" id="theme" title="Mavzuni almashtirish">◐</button>
  </header>
  <div class="sub">Shartnoma PDF'idan ma'lumot ajratish va EISVO API JSON'i bilan taqqoslash</div>

  <div class="card">
    <div class="row">
      <div class="field">
        <label>Shartnoma PDF *</label>
        <input type="file" id="pdf" accept=".pdf">
      </div>
      <div class="field">
        <label>Shartnoma ID (server EISVO API'ga ulansa)</label>
        <input type="text" id="contractId" placeholder="masalan: ZAP-0312" autocomplete="off">
      </div>
      <div class="field">
        <label>yoki EISVO API JSON fayli</label>
        <input type="file" id="apijson" accept=".json,application/json">
      </div>
      <div><button class="primary" id="run">Tekshirish</button></div>
    </div>
    <div class="health" id="health">Serverlar holati tekshirilyapti…</div>
  </div>

  <div class="err" id="err"></div>
  <div class="spinner" id="spin"></div>
  <div id="status-msg"></div>
  <div id="results"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const val = (v) => (v === null || v === undefined || v === "") ? '<span>—</span>' : esc(v);

/* ---- mavzu (light/dark) almashtirish ---- */
(function () {
  const saved = localStorage.getItem("eisvo-theme");
  if (saved) document.documentElement.setAttribute("data-theme", saved);
  $("theme").onclick = () => {
    const cur = document.documentElement.getAttribute("data-theme")
      || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    const next = cur === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    localStorage.setItem("eisvo-theme", next);
  };
})();

/* ---- taqqoslash holati -> 3 ta savat ----
   match      -> Moslik      (ikkalasida bor va mos)
   mismatch   -> Nomoslik    (ikkalasida bor, farqli; YOKI API'da bor, model topmagan)
   topilmadi  -> Topilmadi   (model topdi, API'da yo'q; YOKI ikkalasida ham yo'q; noma'lum kod) */
function bucketOf(status) {
  if (status === "match") return "match";
  if (status === "mismatch") return "mismatch";
  return "notfound"; // missing_api, missing_pdf, unknown_code
}
const BADGES = {
  match:        ["b-match",    "✓", "MOSLIK"],
  mismatch:     ["b-mismatch", "✗", "NOMOSLIK"],
  missing_api:  ["b-na",       "○", "API'DA YO'Q"],      // model topdi, API'da yo'q
  missing_pdf:  ["b-na",       "○", "IKKALASIDA YO'Q"],  // ikkalasida ham yo'q
  unknown_code: ["b-unknown",  "?", "NOMA'LUM KOD"],
  high:         ["b-high",     "✓", "OCR HIGH"],
  low:          ["b-low",      "!", "OCR LOW"],
  failed:       ["b-failed",   "✗", "OCR XATO"],
  na:           ["b-na",       "○", "TOPILMADI"],
};
const badge = (s) => {
  const [cls, icon, label] = BADGES[s] || ["b-na", "○", String(s).toUpperCase()];
  return `<span class="badge ${cls}">${icon} ${label}</span>`;
};

const FIELD_LABELS = {
  "contract_number": "Shartnoma raqami", "contract_date": "Shartnoma sanasi",
  "currency": "Shartnoma valyutasi", "total_amount": "Shartnoma umumiy summasi",
  "seller.name": "Sotuvchi nomi", "seller.country": "Sotuvchi davlati",
  "seller.address": "Sotuvchi manzili", "seller.inn": "Sotuvchi INN",
  "seller.bank.name": "Sotuvchi banki", "seller.bank.swift": "Sotuvchi bank SWIFT",
  "seller.bank.account": "Sotuvchi hisob raqami", "seller.bank.mfo": "Sotuvchi bank MFO",
  "seller.bank.attributes": "Sotuvchi bank rekvizitlari (SWIFT + hisob)",
  "buyer.name": "Xaridor nomi", "buyer.country": "Xaridor davlati",
  "buyer.address": "Xaridor manzili", "buyer.inn": "Xaridor INN",
  "buyer.bank.name": "Xaridor banki", "buyer.bank.swift": "Xaridor bank SWIFT",
  "buyer.bank.account": "Xaridor hisob raqami", "buyer.bank.mfo": "Xaridor bank MFO",
  "buyer.bank.attributes": "Xaridor bank rekvizitlari (SWIFT + hisob)",
  "receiver.name": "Qabul qiluvchi — Consignee (Грузополучатель)",
  "receiver.country": "Qabul qiluvchi davlati", "receiver.address": "Qabul qiluvchi manzili",
  "receiver.inn": "Qabul qiluvchi INN",
  "supplier.name": "Jo'natuvchi — Consignor (Грузоотправитель)",
  "supplier.country": "Jo'natuvchi davlati", "supplier.inn": "Jo'natuvchi INN",
  "manufacturer.name": "Ishlab chiqaruvchi (Производитель)",
  "manufacturer.country": "Ishlab chiqaruvchi davlati", "manufacturer.inn": "Ishlab chiqaruvchi INN",
  "specification_number": "Spetsifikatsiya raqami",
  "payment_currency": "To'lov valyutasi", "payment_deadline": "To'lov muddati",
  "delivery.place": "Yetkazib berish joyi", "delivery.incoterms": "Incoterms sharti",
};
const PROD_LABELS = { name: "nomi", hs_code: "HS/TN VED kodi", unit: "o'lchov birligi",
                      quantity: "miqdori", price: "birlik narxi", amount: "summasi" };

async function health() {
  try {
    const h = await (await fetch("/api/health")).json();
    const dot = ok => `<span class="dot" style="background:${ok ? "var(--ok)" : "var(--bad)"}"></span>`;
    $("health").innerHTML =
      `<span>${dot(h.surya)}Surya OCR server</span><span>${dot(h.llm)}Qwen3 LLM server</span>` +
      ((!h.surya || !h.llm) ? `<span><i>server hali tayyor emas — model yuklanmoqda</i></span>` : "");
  } catch { $("health").textContent = "Backend'ga ulanib bo'lmadi"; }
}
health(); setInterval(health, 15000);

$("run").onclick = async () => {
  const pdf = $("pdf").files[0];
  if (!pdf) { alert("PDF tanlang"); return; }
  const fd = new FormData();
  fd.append("pdf", pdf);
  const cid = $("contractId").value.trim();
  if (cid) fd.append("contract_id", cid);          // 1-ustuvor: server API'ga ID bilan
  else if ($("apijson").files[0]) fd.append("api_json", $("apijson").files[0]);  // yoki JSON fayl

  $("err").style.display = "none"; $("results").innerHTML = "";
  $("spin").style.display = "block"; $("run").disabled = true;
  $("status-msg").textContent = "OCR + LLM ishlayapti — sahifalar soniga qarab 1-5 daqiqa…";
  try {
    const r = await fetch("/api/process", { method: "POST", body: fd });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || `HTTP ${r.status}`);
    render(await r.json());
  } catch (e) {
    $("err").textContent = "Xato: " + e.message; $("err").style.display = "block";
  } finally {
    $("spin").style.display = "none"; $("run").disabled = false; $("status-msg").textContent = "";
  }
};

/* taqqoslash natijasini yagona qatorlar ro'yxatiga yig'ish (maydonlar + tovarlar).
   Har qator {key, desc, pdf, api, status, ocr}. status compare.py'dan keladi va
   bucketOf() bilan Moslik / Nomoslik / Topilmadi'ga ajratiladi. */
function buildRows(d) {
  const rows = [];
  for (const [k, f] of Object.entries(d.comparison.fields)) {
    rows.push({ key: k, desc: FIELD_LABELS[k] || "", pdf: f.pdf, api: f.api,
                status: f.status, ocr: f.ocr_confidence });
  }
  const p = d.comparison.products;
  p.rows.forEach((r, i) => {
    const nm = r.pdf?.name ? ` (${r.pdf.name})` : "";
    if (!r.api) {
      // model tovarni topdi, lekin API'da bunday tovar yo'q -> Topilmadi
      rows.push({ key: `products[${i}]`, desc: `Tovar ${i + 1}${nm} — model topdi, APIda yo'q`,
                  pdf: r.pdf?.name, api: null, status: "missing_api" });
      return;
    }
    const apiVals = { name: r.api.itemsName, hs_code: r.api.tnCode, unit: r.api.unitCode,
                      quantity: r.api.quantity, price: r.api.cost, amount: r.api.amount };
    for (const [fk, fv] of Object.entries(r.fields)) {
      rows.push({ key: `products[${i}].${fk}`,
                  desc: `Tovar ${i + 1}${nm} — ${PROD_LABELS[fk] || fk}`,
                  pdf: r.pdf?.[fk], api: apiVals[fk], status: fv.status });
    }
  });
  p.unmatched_api.forEach((g, i) => {
    // API'da bor, model PDF'dan topolmagan tovar -> Nomoslik
    rows.push({ key: `api_goods[${i}]`, desc: `APIdagi tovar — model PDFda topolmadi`,
                pdf: null, api: g.itemsName, status: "mismatch" });
  });
  if (p.totals && p.totals.status !== "missing") {
    rows.push({ key: "products.jami", desc: "Tovarlar jami summasi",
                pdf: p.totals.pdf_sum, api: p.totals.api_sum, status: p.totals.status });
  }
  return rows;
}

let allRows = [], curFilter = "mismatch";

function counts() {
  const c = { match: 0, mismatch: 0, notfound: 0 };
  for (const r of allRows) c[bucketOf(r.status)]++;
  return c;
}

function renderTable() {
  const inBucket = (r) => curFilter === "all" || bucketOf(r.status) === curFilter;
  const rows = allRows.filter(inBucket);
  const c = counts();
  const tabDefs = [
    ["mismatch", "Nomosliklar", c.mismatch],
    ["match",    "Mosliklar",   c.match],
    ["notfound", "Topilmadi",   c.notfound],
    ["all",      "Hammasi",     allRows.length],
  ];
  const tabs = tabDefs.map(([k, t, n]) =>
    `<button class="tab ${curFilter === k ? "active" : ""}" onclick="setFilter('${k}')">
       ${t} <span class="cnt">${n}</span></button>`).join("");

  const body = rows.length ? rows.map(r => `
    <tr>
      <td><div class="fname">${esc(r.key)}</div><div class="fdesc">${esc(r.desc)}</div></td>
      <td class="val ${r.pdf == null || r.pdf === "" ? "empty-val" : ""}">${val(r.pdf)}</td>
      <td class="val ${r.api == null || r.api === "" ? "empty-val" : ""}">${val(r.api)}</td>
      <td>${badge(r.status)}${r.ocr && r.ocr !== "high" ? " " + badge(r.ocr) : ""}</td>
    </tr>`).join("")
    : `<tr><td colspan="4"><div class="empty">Bu bo'limda qatorlar yo'q</div></td></tr>`;

  $("cmp-area").innerHTML = `
    <div class="tabs">${tabs}</div>
    <div class="legend">
      <span>${badge("match")} ikkalasida bor va mos</span>
      <span>${badge("mismatch")} farqli yoki API'da bor, model topmagan</span>
      <span>${badge("missing_api")} model topdi, API'da yo'q</span>
      <span>${badge("missing_pdf")} ikkalasida ham yo'q</span>
    </div>
    <div class="card" style="padding:2px 4px">
      <div class="tbl-wrap"><table>
        <thead><tr><th>Maydon</th><th>Model (PDF)</th><th>API (JSON)</th><th>Holat</th></tr></thead>
        <tbody>${body}</tbody>
      </table></div>
    </div>`;
}
function setFilter(f) { curFilter = f; renderTable(); }

function render(d) {
  let html = "";
  const hasCmp = !!d.comparison;

  if (hasCmp) {
    allRows = buildRows(d);
    const c = counts();
    const verdict = c.mismatch > 0 ? "bad" : "ok";
    html += `<div class="verdict v-${verdict}">
      <div class="icon">${verdict === "bad" ? "✗" : "✓"}</div>
      <div>
        <div class="word">${verdict === "bad" ? "NOMOSLIK" : "MOSLIK"}</div>
        <div class="expl">${verdict === "bad"
          ? `Shartnoma va API o'rtasida ${c.mismatch} ta nomoslik topildi`
          : "Taqqoslangan barcha maydonlar API ma'lumotlariga mos"}</div>
      </div>
    </div>`;
    html += `<div class="kpis">
      <div class="kpi"><b>${c.match + c.mismatch}</b><span>Taqqoslandi</span></div>
      <div class="kpi k-ok"><b>${c.match}</b><span>Moslik</span></div>
      <div class="kpi k-bad"><b>${c.mismatch}</b><span>Nomoslik</span></div>
      <div class="kpi k-na"><b>${c.notfound}</b><span>Topilmadi</span></div>
    </div>`;
    html += `<div id="cmp-area"></div>`;
    curFilter = c.mismatch > 0 ? "mismatch" : "all";
  } else {
    const v = d.validation?.summary || {};
    const verdict = v.overall === "failed" ? "bad" : "ok";
    html += `<div class="verdict v-${verdict}">
      <div class="icon">${verdict === "ok" ? "✓" : "!"}</div>
      <div>
        <div class="word">${verdict === "ok" ? "OK" : "DIQQAT"}</div>
        <div class="expl">API JSON berilmadi — faqat ajratish natijasi. OCR ishonch: ${esc(v.overall)}</div>
      </div>
    </div>`;
    html += `<div class="kpis">
      <div class="kpi k-ok"><b>${v.high ?? 0}</b><span>Ishonchli maydon</span></div>
      <div class="kpi"><b>${v.low ?? 0}</b><span>Past ishonch</span></div>
      <div class="kpi k-bad"><b>${v.failed ?? 0}</b><span>Xato (format/OCR)</span></div>
      <div class="kpi k-na"><b>${v.na ?? 0}</b><span>Topilmadi</span></div>
    </div>`;

    // taqqoslashsiz rejimda OCR/Validator ogohlantirishlari alohida ko'rsatiladi
    const vf = d.validation?.fields || {};
    const bad = Object.entries(vf).filter(([, f]) => f.confidence === "low" || f.confidence === "failed");
    if (bad.length) {
      const brows = bad.map(([k, f]) => `
        <tr>
          <td><div class="fname">${esc(k)}</div><div class="fdesc">${esc(FIELD_LABELS[k] || "")}</div></td>
          <td class="val">${val(f.value)}</td>
          <td>${badge(f.confidence)}</td>
          <td class="val">${esc((f.issues || []).join("; "))}</td>
        </tr>`).join("");
      html += `<div class="card"><h2>OCR / Validator ogohlantirishlari</h2>
        <div class="tbl-wrap"><table><thead><tr><th>Maydon</th><th>Qiymat</th><th>Ishonch</th><th>Izoh</th></tr></thead>
        <tbody>${brows}</tbody></table></div></div>`;
    }
  }

  html += `<div class="card">
    <details><summary>Ajratilgan ma'lumot (JSON)</summary>
      <pre>${esc(JSON.stringify(d.extracted, null, 2))}</pre></details>
    <details><summary>OCR Markdown</summary><pre>${esc(d.markdown)}</pre></details>
  </div>`;

  $("results").innerHTML = html;
  if (hasCmp) renderTable();
}
</script>
</body>
</html>
